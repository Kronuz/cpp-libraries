# The Kronuz C++ libraries' shared CI: configure, build, and test a CMake repository on
# Linux (x86_64 with GCC and Clang, arm64), macOS (arm64, x86_64), and FreeBSD, plus an
# ASan and UBSan build. Each repository calls it:
#
#   jobs:
#     ci:
#       uses: Kronuz/cpp-libraries/.github/workflows/cmake.yml@main
name: cmake

on:
  workflow_call:
    inputs:
      cmake_args:
        description: Extra arguments for the configure step
        type: string
        default: ""
      macos_llvm:
        description: Use Homebrew LLVM and libc++ on macOS instead of the runner's Apple toolchain
        type: boolean
        default: false
      freebsd:
        description: Run the FreeBSD job
        type: boolean
        default: true
      sanitize:
        description: Run the ASan and UBSan job
        type: boolean
        default: true
      tsan:
        description: Run the ThreadSanitizer job
        type: boolean
        default: true
      headers:
        description: Check that every public header compiles alone (tools/selfcontained.sh, GCC and Clang)
        type: boolean
        default: false
      headers_skip:
        description: Space-separated globs of headers to leave out of the headers check (.selfcontained-skip lists more)
        type: string
        default: ""
      asan_timeout_minutes:
        description: Timeout in minutes for the ASan and UBSan job
        type: number
        default: 60
      tsan_timeout_minutes:
        description: Timeout in minutes for the ThreadSanitizer job
        type: number
        default: 60
      asan_cxx_flags:
        description: Extra compiler flags for the ASan and UBSan job (e.g. -O1; the build stays Debug, asserts on)
        type: string
        default: ""
      test_parallel:
        description: How many tests ctest runs at once in every job
        type: number
        default: 2
      apt_packages:
        description: Ubuntu packages the build needs
        type: string
        default: ""
      brew_packages:
        description: Homebrew packages the build needs
        type: string
        default: ""
      freebsd_packages:
        description: FreeBSD packages the build needs, beyond cmake and git
        type: string
        default: ""

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # ccache keeps recompiles of unchanged code out of the build; the cache dir is saved per job.
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 500M
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard-library hardening: libstdc++'s assertions, libc++'s extensive mode.
          - { name: linux-x86_64-gcc, os: ubuntu-24.04, cc: gcc, cxx: g++, hardening: "-D_GLIBCXX_ASSERTIONS" }
          - { name: linux-x86_64-clang, os: ubuntu-24.04, cc: clang, cxx: clang++, hardening: "-D_GLIBCXX_ASSERTIONS" }
          - { name: linux-arm64-gcc, os: ubuntu-24.04-arm, cc: gcc, cxx: g++, hardening: "-D_GLIBCXX_ASSERTIONS" }
          - { name: macos-arm64, os: macos-15, cc: clang, cxx: clang++, hardening: "-D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE" }
          - { name: macos-x86_64, os: macos-15-intel, cc: clang, cxx: clang++, hardening: "-D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE" }
    steps:
      - uses: actions/checkout@v5
      - name: Packages (Linux)
        if: runner.os == 'Linux' && inputs.apt_packages != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ inputs.apt_packages }}
      - name: Packages (macOS)
        if: runner.os == 'macOS' && inputs.brew_packages != ''
        run: brew install ${{ inputs.brew_packages }}
      - name: LLVM (macOS)
        if: runner.os == 'macOS' && inputs.macos_llvm
        run: brew install llvm
      - name: ccache
        run: |
          if [[ "${{ runner.os }}" == macOS ]]; then brew install ccache; else sudo apt-get update -q && sudo apt-get install -y -q ccache; fi
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-
      - name: ccache
        run: sudo apt-get update -q && sudo apt-get install -y -q ccache
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-asan-ubsan-${{ github.sha }}
          restore-keys: ccache-linux-asan-ubsan-
      - name: ccache
        run: sudo apt-get update -q && sudo apt-get install -y -q ccache
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-tsan-${{ github.sha }}
          restore-keys: ccache-linux-tsan-
      - name: Configure
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        # RelWithDebInfo without NDEBUG: the tests' assert() calls must stay live.
        run: |
          platform_args=()
          if [[ "${{ runner.os }}" == macOS && "${{ inputs.macos_llvm }}" == true ]]; then
            llvm_prefix=$(brew --prefix llvm)
            export CC="$llvm_prefix/bin/clang" CXX="$llvm_prefix/bin/clang++"
            platform_args+=("-DCMAKE_OSX_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)")
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g" "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g ${{ matrix.hardening }}" "${platform_args[@]}" ${{ inputs.cmake_args }}
      - name: Build
        run: |
          ccache -z
          cmake --build build --parallel 4
      - name: ccache stats
        if: always()
        run: ccache -s
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=ignore --parallel ${{ inputs.test_parallel }}

  sanitize:
    name: linux-asan-ubsan
    if: inputs.sanitize
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.asan_timeout_minutes }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        if: inputs.apt_packages != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ inputs.apt_packages }}
      - name: Configure
        env: { CC: clang, CXX: clang++ }
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -D_GLIBCXX_ASSERTIONS ${{ inputs.asan_cxx_flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" ${{ inputs.cmake_args }}
      - name: Build
        run: |
          ccache -z
          cmake --build build --parallel 4
      - name: ccache stats
        if: always()
        run: ccache -s
      - name: Test
        env: { ASAN_OPTIONS: "detect_leaks=1", UBSAN_OPTIONS: "print_stacktrace=1" }
        run: ctest --test-dir build --output-on-failure --no-tests=ignore --parallel ${{ inputs.test_parallel }}

  tsan:
    name: linux-tsan
    if: inputs.tsan
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.tsan_timeout_minutes }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        if: inputs.apt_packages != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ inputs.apt_packages }}
      - name: Configure
        env: { CC: clang, CXX: clang++ }
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O1 -g -fsanitize=thread -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread" ${{ inputs.cmake_args }}
      - name: Build
        run: |
          ccache -z
          cmake --build build --parallel 4
      - name: ccache stats
        if: always()
        run: ccache -s
      - name: Test
        env: { TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1" }
        run: ctest --test-dir build --output-on-failure --no-tests=ignore --parallel ${{ inputs.test_parallel }}

  freebsd:
    name: freebsd-x86_64
    if: inputs.freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: pkg install -y cmake git ${{ inputs.freebsd_packages }}
          run: |
            cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g" "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g" ${{ inputs.cmake_args }}
            cmake --build build --parallel 4
            ctest --test-dir build --output-on-failure --no-tests=ignore --parallel ${{ inputs.test_parallel }}

  headers:
    name: headers-${{ matrix.cxx }}
    if: inputs.headers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        if: inputs.apt_packages != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ inputs.apt_packages }}
      - name: Check
        env: { CXX: "${{ matrix.cxx }}", CMAKE_ARGS: "${{ inputs.cmake_args }}" }
        # The build tree is only configured: FetchContent puts the first-party dependencies in it.
        run: |
          curl -fsSL https://raw.githubusercontent.com/Kronuz/cpp-libraries/main/tools/selfcontained.sh -o "$RUNNER_TEMP/selfcontained.sh"
          skip=()
          for glob in ${{ inputs.headers_skip }}; do skip+=(-x "$glob"); done
          bash "$RUNNER_TEMP/selfcontained.sh" -b "$RUNNER_TEMP/headers-build" -C "$CMAKE_ARGS" "${skip[@]}" .
